<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="todo-app">
        <header class="app-header">
          <div>
            <p class="eyebrow">Daily planner</p>
            <h1>To Do List</h1>
          </div>
          <div class="header-badge" id="headerBadge">0 tasks</div>
        </header>

        <section class="toolbar">
          <label class="search-box" aria-label="Поиск задач">
            <span class="search-icon">⌕</span>
            <input id="searchInput" type="text" placeholder="Поиск задач..." />
          </label>

          <div class="filter-group" aria-label="Фильтры задач">
            <button class="filter-btn active" data-filter="all" type="button">Все</button>
            <button class="filter-btn" data-filter="active" type="button">Активные</button>
            <button class="filter-btn" data-filter="completed" type="button">Готово</button>
          </div>
        </section>

        <form id="todoForm" class="todo-form">
          <input
            id="todoInput"
            type="text"
            placeholder="Что планируете сделать?"
            autocomplete="off"
          />
          <button type="submit">Добавить</button>
        </form>

        <section class="stats" aria-label="Статистика задач">
          <div class="stat-card">
            <span>Всего</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Осталось</span>
            <strong id="activeCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Готово</span>
            <strong id="doneCount">0</strong>
          </div>
        </section>

        <section class="todo-panel">
          <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        </section>

        <div class="panel-footer">
          <button id="clearCompletedBtn" class="clear-btn" type="button">
            Очистить выполненные
          </button>
        </div>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
